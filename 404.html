<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Página não encontrada — Wellington Dantas</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#200B0F">
<style>
  /* Autossuficiente de propósito: a página de erro é servida em qualquer
     caminho, inclusive fundo de pasta, onde link relativo para CSS quebraria.
     Ela não pode depender de nenhum arquivo para aparecer inteira. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, "Segoe UI", Arial, sans-serif;
    color: #202020; background: #F3F5F7;
    min-height: 100vh; display: grid; align-content: center;
    padding: clamp(24px, 6vw, 72px);
  }
  .caixa { max-width: 640px; margin: 0 auto; }
  .olho {
    font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    color: #A40E20; font-weight: 600; margin-bottom: 18px;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif; font-weight: 400;
    font-size: clamp(34px, 7vw, 62px); line-height: 1.04; letter-spacing: -.02em;
    margin-bottom: 22px;
  }
  p { font-size: 17px; line-height: 1.55; color: #6A6B6B; max-width: 48ch; margin-bottom: 30px; }
  a.btn {
    display: inline-block; background: #E4142C; color: #fff; text-decoration: none;
    font-size: 15px; font-weight: 600; padding: 14px 26px; border-radius: 2px;
  }
  a.btn:hover { background: #B5121E; }
  footer { margin-top: 54px; font-size: 13px; color: #948C8F; }
</style>
</head>
<body>
  <div class="caixa">
    <p class="olho">Erro 404</p>
    <h1>Esse endereço não existe por aqui.</h1>
    <p>Pode ser um link antigo, ou um endereço digitado com um caractere a mais. O caminho de volta é curto.</p>
    <a class="btn" id="voltar" href="/">Voltar para a página inicial</a>
    <footer>Wellington Dantas · Vereador de Picos (PI)</footer>
  </div>
<script>
  /* No GitHub Pages de projeto o site mora em /<repositório>/, não na raiz do
     domínio. Sem esta linha o botão levaria para fora do site. Em domínio
     próprio, a raiz já está certa e nada muda. */
  (function () {
    var pasta = location.pathname.split('/')[1];
    if (location.hostname.indexOf('github.io') !== -1 && pasta) {
      document.getElementById('voltar').href = '/' + pasta + '/';
    }
  })();
</script>
</body>
</html>
