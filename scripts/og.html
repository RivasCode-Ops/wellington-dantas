<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cartão de compartilhamento</title>
<!-- Fonte do arquivo img/og.png. Para regerar:
     chrome --headless=new --disable-gpu --hide-scrollbars --window-size=1200,630 \
            --screenshot="img/og.png" "file:///.../scripts/og.html"
     É a imagem que aparece quando o link do site é colado no WhatsApp. -->
<link rel="stylesheet" href="../css/fontes.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #200B0F; color: #fff;
    font-family: "Inter Tight", system-ui, sans-serif;
    display: grid; grid-template-rows: auto 1fr auto;
    padding: 64px 72px;
  }
  .olho {
    font-size: 19px; letter-spacing: .14em; text-transform: uppercase;
    font-weight: 600; color: #E4142C;
  }
  h1 {
    font-family: "Instrument Serif", Georgia, serif; font-weight: 400;
    font-size: 92px; line-height: 1.0; letter-spacing: -.02em;
    align-self: center; max-width: 22ch;
  }
  .pe { display: flex; align-items: end; justify-content: space-between; gap: 40px; }
  .pe p { font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
  .pe span { display: block; font-size: 17px; font-weight: 600; color: #948C8F; margin-top: 7px; letter-spacing: .12em; text-transform: uppercase; }
  .risco { width: 132px; height: 4px; background: #E4142C; margin-bottom: 26px; }
  svg { width: 72px; height: 72px; flex: 0 0 auto; }
</style>
</head>
<body>
  <p class="olho">Vereador de Picos · Terceiro mandato</p>
  <h1>A cidade que eu ando é a cidade que eu defendo.</h1>
  <div class="pe">
    <div>
      <div class="risco"></div>
      <p>Wellington Dantas<span>Vereador de Picos · PI</span></p>
    </div>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#E4142C" d="M12 2.4 14.95 9.6 22.7 10.15 16.75 15.05 18.65 22.6 12 18.4 5.35 22.6 7.25 15.05 1.3 10.15 9.05 9.6Z"/></svg>
  </div>
</body>
</html>
